<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carry Bot Control Panel</title>
    </head>
<body>
    <div class="container">
        {% if user %}
            <header>
                <h2>🎫 Carry Bot Control Panel</h2>
                <div class="user-profile">
                    <img src="{{ user.avatar_url }}" width="34" style="border-radius: 50%;">
                    <span>Welcome, {{ user.username }}!</span>
                    <a href="/logout">Logout</a>
                </div>
            </header>

            {% else %}
            <div style="text-align: center; padding: 60px 20px;">
                <h2>🔒 Restricted Control Panel</h2>
                <p>You must authorize with Discord to access ticket channels, logs, and bot deployment settings.</p>
                <a href="/login" style="background-color: #5865f2; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold;">
                    🔑 Login with Discord
                </a>
            </div>
        {% endif %}
    </div>
</body>
</html>
